# master에 올라오면 Vercel 운영 환경에 배포한다.
# Vercel Hobby 플랜은 프로젝트 주인이 아닌 사람의 커밋을 Git 연동으로 배포하지 못하므로,
# 주인 계정의 토큰(VERCEL_TOKEN)으로 Vercel CLI를 실행해 배포한다.
# 필요한 저장소 Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy (Vercel production)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사·린트
        run: npm run typecheck && npm run lint  # typecheck는 Next 라우트 타입(RouteContext 등)을 먼저 생성한다
      - name: Vercel 환경 변수 받기
        run: npx vercel@65.0.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: 빌드
        run: npx vercel@65.0.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: 배포
        run: npx vercel@65.0.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
