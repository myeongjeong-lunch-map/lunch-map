# 운영 반영(master 머지)마다 SemVer 태그와 GitHub Release를 만든다 (이슈 #25, README 「버전」).
# - 지난 태그 이후 master에 들어온 PR 브랜치 이름으로 올릴 자리를 정한다:
#   feat/ 가 하나라도 있으면 부(minor), 아니면 수(patch). 주(major)는 릴리스 PR에 release:major 라벨이 있을 때만.
# - package.json은 고치지 않는다 (master 직접 push 금지). 버전은 태그가 기준이다.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 다음 버전 계산
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$last" ]; then echo "태그가 없다. 먼저 v1.0.0을 만든다."; exit 1; fi
          range="$last..HEAD"
          if [ -z "$(git rev-list $range)" ]; then echo "새 커밋 없음"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 머지 커밋 제목: "Merge pull request #N from <owner>/<branch>"
          branches=$(git log $range --merges --format=%s | sed -n 's/^Merge pull request #[0-9]* from [^/]*\///p')
          echo "들어온 브랜치:"; echo "$branches"
          major=false
          for n in $(git log $range --merges --format=%s | sed -n 's/^Merge pull request #\([0-9]*\) from .*/\1/p'); do
            if gh pr view "$n" --json labels -q '.labels[].name' 2>/dev/null | grep -qx 'release:major'; then major=true; fi
          done
          IFS=. read -r MA MI PA <<< "${last#v}"
          if $major; then MA=$((MA+1)); MI=0; PA=0
          elif echo "$branches" | grep -q '^feat/'; then MI=$((MI+1)); PA=0
          else PA=$((PA+1)); fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "version=v$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "다음 버전: v$MA.$MI.$PA"
      - name: 태그와 릴리스 만들기
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.next.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.next.outputs.version }}" \
            --generate-notes \
            --notes-start-tag "${{ steps.next.outputs.last }}"
